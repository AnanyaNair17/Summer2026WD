<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    
  </head>
  <body>
    <p>Rock Paper Scissors</p>
    <button onclick="
      playGame('Rock');
    ">Rock</button>
    
    <button onclick="
      playGame('Paper');
    ">Paper</button>

    <button onclick="
      playGame('Scissors');
    ">Scissors</button> 

    <p class="js-result"></p>
    <p class="js-moves"></p>
    <p class="js-score"></p>

    <button onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      updateScoreElement();
    ">Reset score</button>
    <script>
      let score = JSON.parse(localStorage.getItem('score')) || {
        wins: 0,
        losses: 0,
        ties: 0
      };

      updateScoreElement();

      /*if(score===null){ //can also be written as if(!score)
        score = {
          wins: 0,
          losses: 0,
          ties: 0
        }
      }*/

      function playGame(move){
        const computerMove = pickComputerMove();
        let result = '';

        if(move==='Rock'){
          if(computerMove==='Rock'){
            result = 'It is a Tie.';
          }
          else if(computerMove==='Paper'){
            result = 'You Lose.';
          }
          else{
            result = 'You Win.';
          }
        }
        else if(move==='Paper'){
          if(computerMove==='Paper'){
            result = 'It is a Tie.';
          }
          else if(computerMove==='Scissors'){
            result = 'You Lose.';
          }
          else{
            result = 'You Win.';
          }
        }
        else{
          if(computerMove==='Scissors'){
            result = 'It is a Tie.';
          }
          else if(computerMove==='Rock'){
            result = 'You Lose.';
          }
          else{
            result = 'You Win.';
          }
        }

        if(result==='You Win.'){
          score.wins += 1;
        }
        else if(result==='You Lose.'){
          score.losses += 1;
        }
        else{
          score.ties += 1;
        }

        localStorage.setItem('score', JSON.stringify(score));
        updateScoreElement();
        document.querySelector('.js-result')
          .innerHTML = result;
        
        document.querySelector('.js-moves')
          .innerHTML =  `You ${move} - ${computerMove} Computer`;

        alert(`You picked ${move}. Computer picked ${computerMove}. ${result}
wins: ${score.wins}    losses: ${score.losses}     ties: ${score.ties}`
        );
      }
      
      function updateScoreElement(){
        document.querySelector('.js-score')
          .innerHTML = `wins: ${score.wins}    losses: ${score.losses}     ties: ${score.ties}`;
      }

      function pickComputerMove(){
        const randomNumber = Math.random();
        let computerMove = '';
        if(randomNumber<1/3){
          computerMove = 'Rock';
        }
        else if(randomNumber>=1/3 && randomNumber<2/3){
          computerMove = 'Paper';
        }
        else{
          computerMove = 'Scissors';
        }
        return computerMove;
      }    
    </script>
  </body>
</html>
