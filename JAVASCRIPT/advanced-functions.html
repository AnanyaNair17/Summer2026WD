 <!DOCTYPE html>
<html>
  <head>
    <title>Advanced Functions</title>
    <style>
      
    </style>
  </head>
  <body>
    <button onclick="" class="js-button">Click</button>
    <script>  
      const buttonElement = document.querySelector('.js-button');

      const eventListener = () => {
        console.log('click');
      };
      buttonElement.addEventListener('click', eventListener);
      buttonElement.removeEventListener('click', eventListener);
      buttonElement.addEventListener('click', () => {
        console.log('click again');
      });
      function greeting(){
        console.log('greeting');
      }
      greeting();

      const num = 2;

      const fun1 = function(){
        console.log('greeting');
      };

      console.log(fun1);
      console.log(typeof fun1);
      fun1();
      //hoisting doesnt work if we use the variable syntax for functions

      const obj = {
        num: 2,
        fun: function(){
          console.log('hello');
        }
      };
      obj.fun();

      function run(param){
        param();
      }
      run(function(){
        console.log('hello');
      });

      setTimeout(function(){
        console.log('timeout');
      }, 3000);

      console.log('next line');

      setInterval(function(){
        console.log('interval');
      }, 3000);

      console.log('next line 2');

      [
        'cook food',
        'wash dishes',
        'go to sleep'
      ].forEach(function(value, index){
          // for continue in forEach try this
          if(value==='wash dishes'){
            return;
          }
          console.log(index);
          console.log(value);
      });

      const arrowFunction = (param1, param2) => {
        console.log('hello');
        return 5;
      };
      arrowFunction();

      const oneParam = param => {
        console.log(param+1);
      };
      oneParam(2);

      const oneLine = () => 2+3;
      console.log(oneLine());

      const object2 = {
        method: () => {

        },
        method1() {

        }
      };

      console.log([1,3,-5].filter((value, index) => {
        return value>=0;
      }));

      console.log([1,1,3].map((value, index) => {
        return value*2;
      }));

      console.log([1,1,3].map(value => value*2));
    </script>
  </body>
</html>
